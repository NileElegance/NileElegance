<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tekoura | 3D Egyptian Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { overflow-x: hidden; background: #0a0a0f; color: #fff; }
    
    /* 3D Canvas */
    #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* Floating UI Overlay */
    .container {
      position: relative; z-index: 2; display: flex; flex-wrap: wrap;
      min-height: 100vh; align-items: center; justify-content: space-between;
      padding: 50px 8%; pointer-events: none;
    }

    .hero-text { max-width: 450px; }
    .hero-text h1 { font-size: 3.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 15px; }
    .hero-text h1 span { color: #6366f1; }
    .hero-text p { color: #9ca3af; font-size: 1.1rem; margin-bottom: 25px; line-height: 1.6; }
    .price { font-size: 2rem; font-weight: bold; color: #10b981; margin-bottom: 15px; }

    /* Checkout & Order Form Box */
    .order-box {
      background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px;
      border-radius: 20px; width: 100%; max-width: 400px; pointer-events: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .order-box h2 { font-size: 1.5rem; margin-bottom: 15px; color: #fff; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 5px; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151;
      border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #6366f1; }

    .size-selector { display: flex; gap: 10px; margin-bottom: 15px; }
    .size-btn {
      flex: 1; padding: 10px; background: #1f2937; border: 1px solid #374151;
      color: #fff; border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold;
    }
    .size-btn.active { background: #6366f1; border-color: #6366f1; }

    .submit-btn {
      width: 100%; padding: 14px; background: #25d366; color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #1eb956; }
  </style>
  <!-- Load Three.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Background 3D Viewport -->
  <div id="canvas-container"></div>

  <!-- Store Front Content -->
  <div class="container">
    <div class="hero-text">
      <h1>Tekoura <span>3D Edition</span></h1>
      <p>Interactive 3D Clothing Collection. Drag your mouse across the screen to rotate and view the product details.</p>
      <div class="price">499 EGP</div>
    </div>

    <!-- Order Form to Confirm via WhatsApp for COD -->
    <div class="order-box">
      <h2>Order via Cash on Delivery</h2>
      <form id="orderForm">
        
        <div class="form-group">
          <label>Select Size</label>
          <div class="size-selector">
            <div class="size-btn active" onclick="selectSize(this, 'M')">M</div>
            <div class="size-btn" onclick="selectSize(this, 'L')">L</div>
            <div class="size-btn" onclick="selectSize(this, 'XL')">XL</div>
            <div class="size-btn" onclick="selectSize(this, 'XXL')">XXL</div>
          </div>
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="custName" placeholder="Ahmed Hassan" required>
        </div>

        <div class="form-group">
          <label>Phone Number (Egyptian Mobile)</label>
          <input type="tel" id="custPhone" placeholder="010XXXXXXXX" required>
        </div>

        <div class="form-group">
          <label>Governorate (المحافظة)</label>
          <select id="custGov" required>
            <option value="Cairo">Cairo (القاهرة)</option>
            <option value="Giza">Giza (الجيزة)</option>
            <option value="Alexandria">Alexandria (الإسكندرية)</option>
            <option value="Dakahlia">Dakahlia (الدقهلية)</option>
            <option value="Gharbia">Gharbia (الغربية)</option>
            <option value="Other">Other Governorate</option>
          </select>
        </div>

        <div class="form-group">
          <label>Detailed Address</label>
          <input type="text" id="custAddress" placeholder="Building, Street, Area" required>
        </div>

        <button type="submit" class="submit-btn">
          Verify Order via WhatsApp (COD)
        </button>
      </form>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. THREE.JS 3D SCENE SETUP
    // ----------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 4.5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Create 3D Clothing Mesh (Stylized Torus Mesh)
    const geometry = new THREE.TorusKnotGeometry(1, 0.35, 128, 32);
    const material = new THREE.MeshStandardMaterial({
      color: 0x6366f1,
      roughness: 0.3,
      metalness: 0.7,
      wireframe: false
    });
    const garmentMesh = new THREE.Mesh(geometry, material);
    scene.add(garmentMesh);

    // Background Particle Field
    const particleGeo = new THREE.BufferGeometry();
    const count = 500;
    const posArray = new Float32Array(count * 3);
    for(let i=0; i<count*3; i++) {
      posArray[i] = (Math.random() - 0.5) * 12;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particleMat = new THREE.PointsMaterial({ size: 0.02, color: 0x818cf8 });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Lighting Rigs
    const ambientLight = new THREE.AmbientLight(0xffffff, 1);
    scene.add(ambientLight);

    const light1 = new THREE.PointLight(0x6366f1, 2, 50);
    light1.position.set(5, 5, 5);
    scene.add(light1);

    const light2 = new THREE.PointLight(0x10b981, 2, 50);
    light2.position.set(-5, -5, 2);
    scene.add(light2);

    // Mouse Movement Track
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      garmentMesh.rotation.y += 0.005;
      garmentMesh.rotation.x += 0.003;
      particles.rotation.y -= 0.001;

      // Mouse Response
      garmentMesh.rotation.y += (mouseX * 0.5 - garmentMesh.rotation.y) * 0.05;
      garmentMesh.rotation.x += (mouseY * 0.5 - garmentMesh.rotation.x) * 0.05;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----------------------------------------------------
    // 2. E-COMMERCE FORM & WHATSAPP COD ORDER VERIFICATION
    // ----------------------------------------------------
    let selectedSize = 'M';

    function selectSize(btn, size) {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSize = size;
    }

    // Set your Business WhatsApp Phone Number here (With Egypt Country Code: 20)
    const MY_WHATSAPP_NUMBER = "201000000000"; // REPLACE WITH YOUR NUMBER

    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const gov = document.getElementById('custGov').value;
      const address = document.getElementById('custAddress').value;

      // Format WhatsApp Message
      const message = `Hello Tekoura! I want to confirm my Cash on Delivery order:%0A` +
                      `👕 *Product:* Tekoura 3D Collection%0A` +
                      `📏 *Size:* ${selectedSize}%0A` +
                      `💰 *Price:* 499 EGP (COD)%0A` +
                      `👤 *Name:* ${name}%0A` +
                      `📞 *Phone:* ${phone}%0A` +
                      `📍 *Governorate:* ${gov}%0A` +
                      `🏠 *Address:* ${address}`;

      // Redirect to WhatsApp
      window.open(`https://wa.me/${MY_WHATSAPP_NUMBER}?text=${message}`, '_blank');
    });
  </script>
</body>
</html>
